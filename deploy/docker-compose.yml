# 生产编排（服务器 /opt/channel/deploy/ 下执行）
# 首次：cp .env.example .env 并改强密码
services:
  api:
    build: ../backend
    restart: always
    env_file: .env
    volumes:
      - uploads:/app/uploads
    networks: [app]

  mysql:
    image: mysql:5.7
    restart: always
    ports:
      # 仅回环绑定：供本地开发经 SSH 隧道（3307→3306）访问；公网防火墙不开 3306，不可达
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-guild}
      MYSQL_USER: ${MYSQL_USER:-guild}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: ["mysqld", "--innodb-buffer-pool-size=384M", "--max-connections=120"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      # 仅回环绑定：供本地开发/测试经 SSH 隧道访问；公网防火墙不开 6379
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [app]

  web:
    build: ../frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]
    volumes:
      - uploads:/data/uploads:ro
      - ./certbot/www:/var/www/certbot:ro # certbot 校验目录（签发/续期证书用）
      - ./certs:/etc/nginx/cert:ro        # HTTPS 证书目录（签发后自动生效）
    networks: [app]

networks:
  app: {}

volumes:
  mysql_data: {}
  redis_data: {}
  uploads: {}
