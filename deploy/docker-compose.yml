# 生产编排（服务器 /opt/channel/deploy/ 下执行）
# 首次：cp .env.example .env 并改强密码
services:
  api:
    build: ../backend
    restart: always
    env_file: .env
    volumes:
      - uploads:/app/uploads
    networks: [app]

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: channel
      TZ: Asia/Shanghai
    command: ["mysqld", "--innodb-buffer-pool-size=384M", "--max-connections=120"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [app]

  web:
    build: ../frontend
    restart: always
    ports:
      - "80:80"
    depends_on: [api]
    volumes:
      - uploads:/data/uploads:ro
    networks: [app]

networks:
  app: {}

volumes:
  mysql_data: {}
  redis_data: {}
  uploads: {}
