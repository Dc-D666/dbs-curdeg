# 本地开发依赖：MySQL 5.7 + Redis 7（与生产版本一致）
# 用法：docker compose -f docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_123456
      MYSQL_DATABASE: guild
      MYSQL_USER: guild
      MYSQL_PASSWORD: guild_dev
      TZ: Asia/Shanghai
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_dev_data:
