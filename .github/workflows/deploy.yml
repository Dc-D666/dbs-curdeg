name: ci

# 部署由服务器端 cron 自动完成（每 3 分钟拉取最新代码重建），
# GitHub Actions 仅做代码冒烟测试（无 SSH、无入站依赖）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 后端冒烟测试
        run: cd backend && python -c "from app.main import app; print('OK: API 应用可加载')"
