name: ci

# 部署由服务器端 cron 自动完成（每 3 分钟拉取最新代码重建），
# GitHub Actions 仅做代码冒烟测试（无 SSH、无入站依赖）。
# 注意：CI 环境没有 MySQL/Redis，只跑无需数据库的测试；
# 需要 DB/Redis 的集成测试在本地开发环境运行（详见 backend/tests/conftest.py）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 后端冒烟测试（无 DB/Redis 依赖）
        working-directory: backend
        run: python -m pytest tests/test_smoke.py tests/test_security.py -q

  # 前端类型检查 + 构建验证：错误在 CI 报出，不占服务器部署时间
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 生产构建
        working-directory: frontend
        run: npm run build
