# web 容器内 nginx：静态前端 + 反向代理到 api 容器
# HTTP → HTTPS 重定向（certbot 校验路径例外）
server {
    listen 80;
    server_name guild.weaxi.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    http2 on;
    server_name guild.weaxi.cn;

    ssl_certificate /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # 后端 REST API（关掉 proxy_buffering：AI 帮写/问答的 SSE 需要逐事件实时转发）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # 后端健康检查
    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # WebSocket（通知推送）
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 分享短链跳转（根路径例外，方案 §5.1）
    location /s/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 用户上传文件（与 api 容器共享 uploads 卷）
    location /uploads/ {
        alias /data/uploads/;
    }

    # 前端静态资源（hash 文件名）：长缓存；不存在直接 404，绝不回退 index.html
    # （避免旧版 index.html 引用已删除的旧 chunk 时被回退成 text/html 触发 MIME 错误）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 不缓存：每次回源，保证用户拿到最新入口（核心修复：杜绝旧入口引用旧 chunk）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service Worker 不缓存：PWA 更新关键，必须能及时拉取新 sw.js
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # 前端 SPA（无扩展名的路由 fallback 到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
